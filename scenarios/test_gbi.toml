affiliation = "Friendly"
lat = 60.0
lon = -160.0
range_km = 2000.0

# ICBM - ~8000km range, apogee ~800km (mid envelope)
[[missiles]]
name = "ICBM-1"
affiliation = "Hostile"
origin_lat = 40.0
origin_lon = 125.0
target_lat = 37.5
target_lon = -122.0
launch_delay_sec = 20.0

# ICBM - ~10000km range, apogee ~1000km (high midcourse)
[[missiles]]
