# GBI (Ground-Based Interceptor) Test Scenario
# Isolated test of GBI + SBX radar against ICBM midcourse
# Engagement envelope: 200-2000km altitude, ~2000km range

[metadata]
id = "test_gbi"
name = "GBI Test"
description = "GBI Site vs ICBM midcourse (200-2000km altitude envelope)"
region = "Pacific"
center_lat = 50.0
center_lon = -160.0
zoom = 2.5

# Single GBI site
[[defense_units]]
name = "GBI Test Site"
affiliation = "Friendly"
lat = 64.0
lon = -152.0
type = "GBI"
interceptors = 44

# SBX radar for long-range tracking
