# Arrow 3 Test Scenario
# Isolated test of Arrow 3 + Green Pine radar against MRBM/IRBM-class threats
# Arrow 3 envelope: 100-1000 km altitude (exo-atmospheric), ~2,400 km flyout
# range, ~3.0 km/s. Arrow 3 intercepts its targets IN SPACE - it complements
# Arrow 2, which engages targets in the upper atmosphere.
# https://missilethreat.csis.org/defsys/arrow-3/
# All missiles use config-backed profiles; Iranian-launch-axis geometry.

[metadata]
id = "test_arrow3"
name = "Arrow 3 Test"
description = "Arrow 3 Battery vs Shahab-3/Sejjil/RS-26 (exo-atmospheric, 100-1000km envelope)"
region = "Middle East"
center_lat = 31.0
center_lon = 35.0
zoom = 4.0

# Single Arrow 3 battery - Green Pine 120-degree cone aimed at Iran (bearing 67)
[[defense_units]]
name = "Arrow 3 Test Battery"
affiliation = "Friendly"
lat = 31.0
lon = 35.0
type = "Arrow3"
interceptors = 24
facing_deg = 67.0  # Iran launch axis (bearing 67 from central Israel)

# Shahab-3: apogee 150 + 0.18*range
# ~1,608 km range -> ~439 km apogee - INSIDE Arrow 3's 100-1000 km envelope
# through the whole upper arc: exo-atmospheric midcourse engagement
[[missiles]]
name = "Shahab-3 #1"
affiliation = "Hostile"
origin_lat = 35.7
origin_lon = 51.4
target_lat = 31.0
target_lon = 35.0
launch_delay_sec = 10.0

# Shahab-3: ~1,940 km range -> ~499 km apogee - exo engagement
[[missiles]]
name = "Shahab-3 #2"
affiliation = "Hostile"
origin_lat = 35.7
origin_lon = 51.4
target_lat = 24.0
target_lon = 35.0
launch_delay_sec = 25.0

# RS-26: apogee 300 + 0.12*range
# ~3,290 km range -> ~695 km apogee - upper-envelope exo engagement
[[missiles]]
name = "RS-26 Rubezh #1"
affiliation = "Hostile"
origin_lat = 35.7
origin_lon = 51.4
target_lat = 15.0
target_lon = 42.0
launch_delay_sec = 40.0