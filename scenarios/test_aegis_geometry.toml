# AEGIS Geometry Test Scenario
# Tests intercept guidance at various engagement angles
# Platform at (35.0, 140.0) - SPY-1D is 360-degree coverage, no facing needed
# Missiles use config-backed profiles (" #N" suffix resolves to the base config).

[metadata]
id = "test_aegis_geometry"
name = "AEGIS Geometry Test"
description = "Tests intercept guidance at head-on, crossing, and oblique angles"
region = "Pacific"
center_lat = 35.0
center_lon = 140.0
zoom = 4.0

# Single AEGIS destroyer
[[defense_units]]
name = "USS Test (DDG)"
affiliation = "Friendly"
lat = 35.0
lon = 140.0
type = "Aegis"
interceptors = 48

# ============================================================================
# HEAD-ON ENGAGEMENT (missile targeting the platform)
# Interceptor flies toward incoming missile - optimal geometry
# Shahab-3 profile: ~1,365 km range -> ~395 km apogee
# ============================================================================

[[missiles]]
name = "Shahab-3 #HEAD-ON"
affiliation = "Hostile"
origin_lat = 35.0
origin_lon = 155.0
target_lat = 35.0
target_lon = 140.0
launch_delay_sec = 10.0

# ============================================================================
# CROSSING ENGAGEMENT (missile passing by the platform)
# Interceptor must lead the target significantly
# Shahab-3 profile: ~3,070 km range -> ~702 km apogee; crossing geometry
# legitimately misses (gimbal-limited terminal homing) - that is the test
# ============================================================================

[[missiles]]
name = "Shahab-3 #CROSSING"
affiliation = "Hostile"
origin_lat = 33.0
origin_lon = 155.0
target_lat = 33.0
target_lon = 125.0
launch_delay_sec = 20.0

# ============================================================================
# OBLIQUE ENGAGEMENT (45-degree type angle)
# Mixed geometry - some lead required
# Shahab-3 profile: ~1,300 km range -> ~384 km apogee
# ============================================================================

[[missiles]]
name = "Shahab-3 #OBLIQUE"
affiliation = "Hostile"
origin_lat = 42.0
origin_lon = 152.0
target_lat = 32.0
target_lon = 138.0
launch_delay_sec = 30.0