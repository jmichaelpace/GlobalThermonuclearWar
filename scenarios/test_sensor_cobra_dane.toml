# Cobra Dane Radar Test Scenario
# Shemya Island, Alaska - Early warning and tracking radar
# Cobra Dane config: 3000 km nominal detection (1.5x = 4500 km max), L-band,
# 120-degree azimuth cone (phased array).

[metadata]
id = "test_sensor_cobra_dane"
name = "Cobra Dane Test"
description = "Cobra Dane early warning radar tracking test (Shemya Island)"
region = "Pacific"
center_lat = 52.7
center_lon = 174.1
zoom = 2.5

# Cobra Dane radar (Shemya Island, Alaska) - 120-degree cone aimed at the
# NK launch region (NK launch sites span bearings 208-267 from Shemya; 240
# centers the arc)
[[radar_stations]]
name = "Cobra Dane"
affiliation = "Friendly"
lat = 52.7
lon = 174.1
range_km = 3000.0
sensor_config = "Cobra Dane"
facing_deg = 240.0

# Hwasong-15 profile (apogee 800 + 0.08*range) - NK->CONUS arcs.
# Range ladder measures detection vs the 3000 km nominal / 4500 km max.

# Close range ICBM - boost arc ~800 km from radar (Kamchatka axis)
[[missiles]]
name = "Hwasong-15 #Close"
affiliation = "Hostile"
origin_lat = 45.0
origin_lon = 168.0
target_lat = 37.5
target_lon = -122.0
launch_delay_sec = 15.0

# Near range ICBM - NK->NYC arc passes ~1,500 km from radar
[[missiles]]
name = "Hwasong-15 #Near"
affiliation = "Hostile"
origin_lat = 40.0
origin_lon = 125.0
target_lat = 40.7
target_lon = -74.0
launch_delay_sec = 30.0

# Mid range ICBM - NK->LA arc passes ~2,000 km from radar
[[missiles]]
name = "Hwasong-15 #Mid"
affiliation = "Hostile"
origin_lat = 42.0
origin_lon = 130.0
target_lat = 34.0
target_lon = -118.2
launch_delay_sec = 45.0

# Far range ICBM - NK->Seattle arc passes ~2,800 km from radar (near limit)
[[missiles]]
name = "Hwasong-15 #Far"
affiliation = "Hostile"
origin_lat = 35.0
origin_lon = 127.0
target_lat = 47.6
target_lon = -122.3
launch_delay_sec = 60.0

# Beyond detection range - arc passes ~3,500 km from radar
[[missiles]]
name = "Hwasong-15 #Beyond"
affiliation = "Hostile"
origin_lat = 30.0
origin_lon = 120.0
target_lat = 38.9
target_lon = -77.0
launch_delay_sec = 75.0