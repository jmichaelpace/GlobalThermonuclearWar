# PAVE PAWS Radar Test Scenario
# Phased Array Warning System - Beale AFB, California
# PAVE PAWS config: 3000 km nominal detection (1.5x = 4500 km max), L-band
# (stand-in for the real UHF), 240-degree azimuth (two 120-degree faces).

[metadata]
id = "test_sensor_pave_paws"
name = "PAVE PAWS Test"
description = "PAVE PAWS early warning radar test (Beale AFB)"
region = "Pacific"
center_lat = 39.1
center_lon = -121.4
zoom = 3.0

# PAVE PAWS radar (Beale AFB, California) - 240-degree cone aimed at the
# Pacific threat axis (west/NW: SLBM boxes and the NK bearing at 314)
[[radar_stations]]
name = "PAVE PAWS Beale"
affiliation = "Friendly"
lat = 39.1
lon = -121.4
range_km = 3000.0
sensor_config = "PAVE PAWS"
facing_deg = 280.0  # Covers bearings 160-400 (i.e. 160-360 + 0-40): the whole Pacific arc plus polar approaches

# SLBM - Bulava profile (apogee 500 + 0.1*range, 4 decoys)
# Pacific launch box, ~740 km from radar at boost
[[missiles]]
name = "Bulava #Close"
affiliation = "Hostile"
origin_lat = 35.0
origin_lon = -128.0
target_lat = 37.5
target_lon = -122.0
launch_delay_sec = 15.0

# IRBM - RS-26 profile; mid-Pacific launch box
[[missiles]]
name = "RS-26 Rubezh #Near"
affiliation = "Hostile"
origin_lat = 40.0
origin_lon = 175.0
target_lat = 34.0
target_lon = -118.2
launch_delay_sec = 30.0

# ICBM - Hwasong-15 profile, NK->NYC arc; closest approach ~2,200 km
[[missiles]]
name = "Hwasong-15 #Mid"
affiliation = "Hostile"
origin_lat = 42.0
origin_lon = 130.0
target_lat = 40.7
target_lon = -74.0
launch_delay_sec = 50.0

# ICBM - Hwasong-15 profile, NK->DC arc; closest approach ~2,900 km (near limit)
[[missiles]]
name = "Hwasong-15 #Far"
affiliation = "Hostile"
origin_lat = 40.0
origin_lon = 125.0
target_lat = 38.9
target_lon = -77.0
launch_delay_sec = 70.0

# Beyond range - deep-Pacific launch, closest approach ~3,500 km
[[missiles]]
name = "Hwasong-15 #Beyond"
affiliation = "Hostile"
origin_lat = 35.0
origin_lon = 115.0
target_lat = 47.6
target_lon = -122.3
launch_delay_sec = 90.0