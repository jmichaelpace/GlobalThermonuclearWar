# Fylingdales Radar Test Scenario
# RAF Fylingdales, UK - BMEWS (Ballistic Missile Early Warning System)
# Fylingdales config: 3000 km nominal detection (1.5x = 4500 km max), L-band
# (stand-in for the real UHF), 360-degree azimuth (three 120-degree faces).

[metadata]
id = "test_sensor_fylingdales"
name = "Fylingdales BMEWS Test"
description = "RAF Fylingdales early warning radar test (UK)"
region = "Europe"
center_lat = 54.4
center_lon = -0.7
zoom = 3.0

# Fylingdales radar (North Yorkshire, UK) - 360-degree coverage, no facing
[[radar_stations]]
name = "Fylingdales BMEWS"
affiliation = "Friendly"
lat = 54.4
lon = -0.7
range_km = 3000.0
sensor_config = "Fylingdales"

# Threat ladder from the east (Russian launch axis). Config-backed profiles.

# MRBM - RS-26 profile, Moscow->Berlin arc passes ~1,000 km from radar
[[missiles]]
name = "RS-26 Rubezh #Near"
affiliation = "Hostile"
origin_lat = 55.8
origin_lon = 37.6
target_lat = 52.5
target_lon = 13.4
launch_delay_sec = 20.0

# IRBM - RS-26 profile, Moscow->Paris arc passes ~1,800 km from radar
[[missiles]]
name = "RS-26 Rubezh #Mid"
affiliation = "Hostile"
origin_lat = 55.8
origin_lon = 37.6
target_lat = 48.8
target_lon = 2.3
launch_delay_sec = 40.0

# ICBM - Hwasong-15 profile, ~2,500 km from radar at closest approach
[[missiles]]
name = "Hwasong-15 #Far"
affiliation = "Hostile"
origin_lat = 60.0
origin_lon = 50.0
target_lat = 51.5
target_lon = -0.1
launch_delay_sec = 60.0

# ICBM - Hwasong-15 profile, arc passes ~3,000 km from radar (at nominal limit)
[[missiles]]
name = "Hwasong-15 #Limit"
affiliation = "Hostile"
origin_lat = 65.0
origin_lon = 60.0
target_lat = 40.7
target_lon = -74.0
launch_delay_sec = 80.0

# Beyond range - arc passes ~3,500 km from radar (past nominal, in the
# degraded 1.5x zone or fully outside)
[[missiles]]
name = "Hwasong-15 #Beyond"
affiliation = "Hostile"
origin_lat = 70.0
origin_lon = 70.0
target_lat = 38.9
target_lon = -77.0
launch_delay_sec = 100.0