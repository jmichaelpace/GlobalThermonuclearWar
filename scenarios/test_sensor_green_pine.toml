# Green Pine / Super Green Pine Radar Test Scenario
# Israeli early warning and fire control radar for Arrow system
# Green Pine config: 800 km nominal detection (1.5x = 1200 km max), L-band,
# 120-degree azimuth cone, 1.6x track / 2.2x fire-control multipliers.

[metadata]
id = "test_sensor_green_pine"
name = "Green Pine Radar Test"
description = "Israeli Green Pine/Super Green Pine radar test (Arrow fire control)"
region = "Middle East"
center_lat = 31.0
center_lon = 35.0
zoom = 4.5

# Green Pine radar (Central Israel) - 120-degree cone aimed at Iran (bearing 67)
[[radar_stations]]
name = "Super Green Pine"
affiliation = "Friendly"
lat = 31.0
lon = 35.0
range_km = 800.0
sensor_config = "Green Pine"
facing_deg = 67.0

# Threat ladder on the Iran axis. Config-backed profiles.

# SRBM - Iskander-M profile, ~250 km from radar (inside nominal)
[[missiles]]
name = "Iskander-M #Close"
affiliation = "Hostile"
origin_lat = 33.5
origin_lon = 36.3
target_lat = 31.0
target_lon = 35.0
launch_delay_sec = 10.0

# MRBM - Shahab-3 profile, western-Iraq launch ~450 km from radar
[[missiles]]
name = "Shahab-3 #Near"
affiliation = "Hostile"
origin_lat = 33.3
origin_lon = 44.4
target_lat = 31.0
target_lon = 35.0
launch_delay_sec = 25.0

# MRBM - Shahab-3 profile, Iran launch ~1,608 km from radar (detected on
# the climb portion as it enters the 1200 km max envelope)
[[missiles]]
name = "Shahab-3 #Mid"
affiliation = "Hostile"
origin_lat = 35.7
origin_lon = 51.4
target_lat = 31.0
target_lon = 35.0
launch_delay_sec = 40.0

# IRBM - RS-26 profile, long arc from Iran; long stretches inside envelope
[[missiles]]
name = "RS-26 Rubezh #Limit"
affiliation = "Hostile"
origin_lat = 35.7
origin_lon = 51.4
target_lat = 24.0
target_lon = 35.0
launch_delay_sec = 55.0

# Beyond the cone - deep-south arc that exits the 120-degree azimuth cone
# before reaching the radar: azimuth-gated non-detection (not range-gated)
[[missiles]]
name = "RS-26 Rubezh #Beyond"
affiliation = "Hostile"
origin_lat = 35.7
origin_lon = 51.4
target_lat = 20.0
target_lon = 40.0
