# Don-2N Radar Test Scenario
# Russian ABM radar protecting Moscow (A-135 system)
# Don-2N config: 1000 km nominal detection (1.5x = 1500 km max), X-band
# (cm-wave), 360-degree azimuth (four 90-degree faces).

[metadata]
id = "test_sensor_don2n"
name = "Don-2N Radar Test"
description = "Russian Don-2N ABM radar test (Moscow defense)"
region = "Europe"
center_lat = 55.8
center_lon = 37.6
zoom = 4.0

# Don-2N radar (Pushkino, Moscow) - 360-degree coverage, no facing needed
[[radar_stations]]
name = "Don-2N Pushkino"
affiliation = "Friendly"
lat = 55.9
lon = 37.8
range_km = 1000.0
sensor_config = "Don-2N"

# Threat ladder: western/northwestern launch points approaching Moscow.
# Config-backed profiles (SLBM/ICBM per range class).

# SRBM - Iskander-M profile, ~370 km from radar (inside nominal)
[[missiles]]
name = "Iskander-M #Close"
affiliation = "Hostile"
origin_lat = 53.0
origin_lon = 35.0
target_lat = 55.8
target_lon = 37.6
launch_delay_sec = 10.0

# SLBM - Sineva profile (apogee 600 + 0.09*range, 4 decoys), Norwegian Sea
# launch ~780 km from radar
[[missiles]]
name = "Sineva #Near"
affiliation = "Hostile"
origin_lat = 50.4
origin_lon = 30.5
target_lat = 55.8
target_lon = 37.6
launch_delay_sec = 25.0

# SLBM - Bulava profile (apogee 500 + 0.1*range), Barents Sea launch,
# arc passes ~1,170 km from radar (past nominal, inside 1.5x max)
[[missiles]]
name = "Bulava #Mid"
affiliation = "Hostile"
origin_lat = 52.2
origin_lon = 21.0
target_lat = 55.8
target_lon = 37.6
launch_delay_sec = 40.0

# SLBM - Trident II profile (apogee 700 + 0.08*range), Norwegian Sea launch
# on a Moscow-bound arc, ~1,300 km from radar
[[missiles]]
name = "Trident II #Limit"
affiliation = "Hostile"
origin_lat = 50.1
origin_lon = 8.7
target_lat = 55.8
target_lon = 37.6
launch_delay_sec = 55.0

# Beyond range - mid-Atlantic launch, closest approach ~1,400+ km
# (outside the 1.5x envelope for most of the arc)
[[missiles]]
name = "Trident II #Beyond"
affiliation = "Hostile"
origin_lat = 48.8
origin_lon = 2.3
target_lat = 55.8
target_lon = 37.6
launch_delay_sec = 70.0