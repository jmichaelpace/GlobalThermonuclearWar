# Demo Scenario
# Multi-region demonstration with various missile types and defense systems

[metadata]
id = "demo"
name = "Demo Scenario"
description = "Multi-region demonstration with various threats"
region = "Global"
center_lat = 20.0
center_lon = 0.0
zoom = 2.0

# US Defense Assets
[[defense_units]]
name = "THAAD California"
affiliation = "Friendly"
lat = 37.5
lon = -122.0
type = "THAAD"
interceptors = 48
facing_deg = 285.0  # Threat axis: Pacific SRBM launch boxes (W) and NK ICBM approach (WNW)

[[defense_units]]
name = "Aegis Sea of Japan"
affiliation = "Friendly"
lat = 38.0
lon = 132.0
type = "Aegis"
interceptors = 96
# SPY-1 is 360-degree coverage - no facing needed

[[defense_units]]
name = "GBI Alaska"
affiliation = "Friendly"
lat = 64.0
lon = -146.0
type = "GBI"
interceptors = 44
facing_deg = 288.0  # Platform radar (Cobra Dane, 120-degree cone) aimed at NK bearing

# Early Warning - PAVE PAWS at Clear Space Force Station, Alaska
[[radar_stations]]
name = "PAVE PAWS Clear"
affiliation = "Friendly"
lat = 64.3
lon = -149.1
range_km = 3000.0
sensor_config = "PAVE PAWS"
facing_deg = 286.0  # 240-degree coverage aimed at NK (bearing 286) and Iran polar tracks

# Satellites
[[satellites]]
name = "SBIRS GEO-2"
affiliation = "Friendly"
lat = 0.0
lon = 120.0
altitude_km = 35786.0
sensor_type = "Infrared"

# Missiles - Mix of types for demonstration
# All names reference config/missiles/ profiles (" #N" suffixes are stripped
# by the config lookup, so "#1" variants resolve to the base profile).

# ICBMs - Hwasong-15 profile: apogee 800 + 0.08*range
[[missiles]]
name = "Hwasong-15 #1"
affiliation = "Hostile"
origin_lat = 39.0
origin_lon = 125.5
target_lat = 37.5
target_lon = -122.0
launch_delay_sec = 60.0
# ~9,070 km range, ~1,525 km apogee - GBI midcourse engagement

[[missiles]]
name = "Hwasong-15 #2"
affiliation = "Hostile"
origin_lat = 39.0
origin_lon = 125.5
target_lat = 47.6
target_lon = -122.3
launch_delay_sec = 120.0
# ~8,290 km range, ~1,460 km apogee - GBI midcourse engagement

# MRBM - Shahab-3 profile: apogee 150 + 0.18*range
[[missiles]]
name = "Shahab-3 #1"
affiliation = "Hostile"
origin_lat = 35.0
origin_lon = 51.0
target_lat = 32.0
target_lon = 34.8
launch_delay_sec = 30.0
# ~1,585 km range, ~435 km apogee - Israel-bound (no Israeli defense in demo)

# SRBMs - Burkan-2 profile (flat Scud arc): apogee 80 + 0.08*range
# ~880-950 km range, ~150-155 km apogee - descends through THAAD's 40-150 km envelope
[[missiles]]
name = "Burkan-2 #1"
affiliation = "Hostile"
origin_lat = 37.5
origin_lon = -132.0
target_lat = 37.5
target_lon = -122.0
launch_delay_sec = 15.0

[[missiles]]
name = "Burkan-2 #2"
affiliation = "Hostile"
origin_lat = 38.0
origin_lon = -132.5
target_lat = 37.5
target_lon = -122.0
launch_delay_sec = 20.0