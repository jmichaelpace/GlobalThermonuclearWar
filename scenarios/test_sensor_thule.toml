# Thule Radar Test Scenario
# Thule/Pituffik Space Base, Greenland - BMEWS early warning
# Thule config: 3000 km nominal detection (1.5x = 4500 km max), L-band
# (stand-in for the real UHF), 240-degree azimuth (two 120-degree faces).

[metadata]
id = "test_sensor_thule"
name = "Thule BMEWS Test"
description = "Thule early warning radar test (Greenland)"
region = "Arctic"
center_lat = 76.5
center_lon = -68.7
zoom = 2.5

# Thule radar (Pituffik, Greenland) - 240-degree cone aimed at the Russian
# ICBM corridor (bearings from Thule to Russian launch regions span ~20-90)
[[radar_stations]]
name = "Thule BMEWS"
affiliation = "Friendly"
lat = 76.5
lon = -68.7
range_km = 3000.0
sensor_config = "Thule"
facing_deg = 55.0

# SLBM - Sineva profile (apogee 600 + 0.09*range, 4 decoys)
# Arctic launch, ~930 km from radar
[[missiles]]
name = "Sineva #Near"
affiliation = "Hostile"
origin_lat = 70.0
origin_lon = -50.0
target_lat = 40.7
target_lon = -74.0
launch_delay_sec = 20.0

# ICBM - Hwasong-15 profile, ~1,800 km from radar at closest approach
[[missiles]]
name = "Hwasong-15 #Mid"
affiliation = "Hostile"
origin_lat = 60.0
origin_lon = 50.0
target_lat = 38.9
target_lon = -77.0
launch_delay_sec = 40.0

# ICBM - Hwasong-15 profile, Moscow->DC arc, closest approach ~2,500 km
[[missiles]]
name = "Hwasong-15 #Far"
affiliation = "Hostile"
origin_lat = 55.8
origin_lon = 37.6
target_lat = 40.7
target_lon = -74.0
launch_delay_sec = 60.0

# ICBM - Hwasong-15 profile, arc passes ~3,000 km from radar (at nominal limit)
[[missiles]]
name = "Hwasong-15 #Limit"
affiliation = "Hostile"
origin_lat = 50.0
origin_lon = 30.0
target_lat = 38.9
target_lon = -77.0
launch_delay_sec = 80.0

# Beyond range - southern-Russian launch, closest approach ~3,500 km
[[missiles]]
name = "Hwasong-15 #Beyond"
affiliation = "Hostile"
origin_lat = 45.0
origin_lon = 20.0
target_lat = 34.0
target_lon = -118.2
launch_delay_sec = 100.0