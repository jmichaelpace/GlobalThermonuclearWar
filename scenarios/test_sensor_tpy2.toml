# AN/TPY-2 Radar Test Scenario
# THAAD X-band radar in forward-based mode
# AN/TPY-2 config: 1000 km nominal detection (1.5x = 1500 km max), X-band,
# 120-degree azimuth cone, 2.5x track / 4.0x fire-control range multipliers.

[metadata]
id = "test_sensor_tpy2"
name = "AN/TPY-2 Radar Test"
description = "THAAD AN/TPY-2 X-band radar detection test (forward-based mode)"
region = "Pacific"
center_lat = 37.0
center_lon = 127.0
zoom = 4.0

# TPY-2 radar (forward deployed, South Korea) - 120-degree cone aimed at
# the NK launch region (threat bearings 152-206; a 180-centered cone covers it)
[[radar_stations]]
name = "AN/TPY-2 Forward"
affiliation = "Friendly"
lat = 37.0
lon = 127.0
range_km = 1000.0
sensor_config = "AN/TPY-2"
facing_deg = 180.0

# SRBM - Iskander-M profile, ~281 km from radar (well inside 1000 km)
[[missiles]]
name = "Iskander-M #Close"
affiliation = "Hostile"
origin_lat = 39.5
origin_lon = 127.5
target_lat = 37.5
target_lon = 126.9
launch_delay_sec = 10.0

# MRBM - Shahab-3 profile, ~376 km from radar at launch
[[missiles]]
name = "Shahab-3 #Near"
affiliation = "Hostile"
origin_lat = 40.0
origin_lon = 125.0
target_lat = 35.0
target_lon = 126.5
launch_delay_sec = 25.0

# IRBM - RS-26 profile, ~613 km from radar at launch
[[missiles]]
name = "RS-26 Rubezh #Mid"
affiliation = "Hostile"
origin_lat = 42.0
origin_lon = 130.0
target_lat = 34.0
target_lon = 126.0
launch_delay_sec = 40.0

# ICBM - Hwasong-15 profile, NK->CONUS arc: detected on the boost/climb
# portion inside the cone
[[missiles]]
name = "Hwasong-15 #Limit"
affiliation = "Hostile"
origin_lat = 40.0
origin_lon = 125.0
target_lat = 37.5
target_lon = -122.0
launch_delay_sec = 55.0

# Beyond range - ICBM arc from far-north launch site passes ~1,200+ km
# from the radar (outside the 1.5x max envelope) - should stay undetected
[[missiles]]
name = "Hwasong-15 #Beyond"
affiliation = "Hostile"
origin_lat = 50.0
origin_lon = 131.0
target_lat = 40.7
target_lon = -74.0
launch_delay_sec = 70.0