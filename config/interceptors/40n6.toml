# System identification and description
[system]
# Official interceptor designation
# The S-400 platform (config/platform/s400.toml) requests interceptor_type
# = "40N6" and the registry keys on system.name - these must match or every
# S-400 unit silently falls back to the Generic Interceptor config.
name = "40N6"
# Full system name and role
description = "S-400 long-range surface-to-air missile"
# Operating country/nation
country = "Russia"

# Altitude constraints for engagement
[altitude_envelope]
# Minimum altitude where intercepts can occur (km) - below this, out of envelope
min_engagement_altitude_km = 0.01 # https://tass.com/defense/1026630
# Maximum altitude where intercepts can occur (km) - above this, out of envelope
max_engagement_altitude_km = 30.0 # https://tass.com/defense/1026630

# Interceptor flight performance characteristics
[kinematics]
# Duration of powered boost phase (seconds)
boost_duration_sec = 15.0
# Acceleration during boost phase (g-forces, 1g = 9.81 m/s²)
# ~8g x 15s ≈ 1.18 km/s - consistent with the published maximum velocity below.
boost_acceleration_g = 8.0
# Maximum velocity achieved by interceptor (km/s)
# Published 40N6E spec: maximum velocity 1,190 m/s (Mach 3.5)
# https://en.wikipedia.org/wiki/S-400_missile_system (missile spec table);
# TASS test reports cite the same 1,190 m/s figure.
max_velocity_km_s = 1.19
# Maximum g-force for terminal maneuvering to hit target (g-forces)
terminal_maneuver_g = 25.0 # https://weaponsystems.net/system/1417-%3E%3E48N6#:~:text=The%20S%2D300PM%2D2%20introduced%20the%2048N6D%20missile%20with,export%20uses%20the%2048N6E2%20missile.%20S%2D400%20Triumf.
# Altitude at which boost phase ends and coast begins (km)
# At ~1.19 km/s after a 15 s boost the vehicle is well below 30 km.
burnout_altitude_km = 12.0
# Average speed over entire flight (km/s) - used for quick time estimates
# DOCUMENTATION ONLY: the engine derives flight from the boost-physics model
# (InterceptorKinematics in src/simulation/entities.rs), not this field.
# The published 1,190 m/s figure is the missile's MAXIMUM velocity.
average_speed_km_s = 1.190

# Engagement effectiveness parameters
[engagement]
# Base probability of successful intercept if geometry is good (0.0-1.0)
hit_probability = 0.75
# Weight factor for terminal homing accuracy (0.0-1.0, higher = better terminal guidance)
terminal_blend_factor = 0.50
# Guidance type: active (onboard radar), semi_active (requires illumination), or command
# 40N6 carries an active radar seeker for its terminal phase - required for
# its 400 km shots, which exceed the illumination radar's radar horizon.
# https://en.wikipedia.org/wiki/S-400_missile_system
guidance_type = "active"

# Mid-course guidance - 40N6 uses command guidance with datalink updates
[engagement.midcourse_guidance]
divert_budget_km = 45.0  # Moderate divert capability
update_interval_sec = 2.0
min_correction_km = 0.5
enabled = true

# Kill vehicle parameters
[kill_envelope]
# Range at which seeker can acquire and track target (km)
seeker_range_km = 50.0
# Effective radius for kinetic kill (km) - how close interceptor must pass
kill_radius_km = 0.05  # Blast fragmentation warhead (~50m lethal radius)
# Base probability of kill given successful intercept (0.0-1.0)
base_pk = 0.80
