# System identification and description
[system]
# Official missile designation
name = "Iskander-M"
# Full system name and role
description = "Russian road-mobile SRBM with quasi-ballistic trajectory"
# Operating country/nation
country = "Russia"
# NATO reporting name for the missile
nato_designation = "SS-26 Stone"

# Missile classification
[classification]
# Type: ICBM (Intercontinental), IRBM (Intermediate), MRBM (Medium), SRBM (Short), SLBM (Sub-launched)
type = "SRBM"

# Range capabilities
[range]
# Minimum operational range (km) - below this, targeting may be impractical
min_range_km = 50.0
# Maximum range at optimal trajectory (km)
max_range_km = 500.0

# Ballistic trajectory parameters
[trajectory]
# Base apogee altitude (km) - trajectory peak altitude for minimum range
apogee_base_km = 50.0
# How much apogee increases per km of range (multiplier)
apogee_range_factor = 0.1
# Base flight time (seconds) for minimum range shot
flight_time_base_sec = 180.0
# How much flight time increases per km of range (multiplier)
flight_time_range_factor = 0.4

# Boost phase characteristics
[boost]
# Fraction of total flight time spent in powered boost phase (0.0-1.0)
boost_phase_fraction = 0.25
# Velocity at end of boost phase (km/s)
boost_velocity_km_s = 2.1

# Penetration aids and countermeasures
[countermeasures]
# Whether missile deploys decoys and chaff
has_countermeasures = true
# Number of decoys deployed in standard configuration
default_decoys = 2
# Maximum number of decoys that can be deployed
max_decoys = 4

# Radar cross section by flight phase
[radar_signature]
# RCS during boost phase (dBsm) - smaller signature due to compact motor
rcs_boost_dbsm = 3.0
# RCS during midcourse flight (dBsm) - low-observable design
rcs_midcourse_dbsm = -15.0
# RCS during terminal descent (dBsm) - very stealthy terminal phase
rcs_terminal_dbsm = -20.0
