# System identification and description
[system]
# Official satellite designation
name = "Cosmos-2499"
# Full system name and role
description = "Russian space surveillance satellite"
# Operating country/nation
country = "Russia"

# Orbital parameters
[orbit]
# Average orbital altitude above Earth's surface (km)
altitude_km = 1500.0
# Time to complete one orbit (hours)
orbital_period_hours = 2.0
# Orbit classification (GEO=geostationary, HEO=highly elliptical, LEO=low earth)
orbit_type = "LEO"
# Orbital inclination relative to equator (degrees, 0=equatorial)
inclination_deg = 82.0

# Sensor capabilities
[sensor]
# Type of detection sensor (Infrared, Radar, or Optical)
sensor_type = "Radar"
# Field of view cone angle (degrees) - wider = more coverage, less detail
coverage_angle_deg = 3.0
# Maximum range for reliable target detection (km)
detection_range_km = 2000.0
# Can detect missile launch plumes during boost phase
can_detect_boost_phase = false
# Can track missiles during unpowered midcourse flight
can_track_midcourse = true
# How often satellite can update track on same target (seconds)
revisit_time_sec = 5.0
