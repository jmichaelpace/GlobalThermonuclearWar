[system]
name = "SBIRS-HEO"
description = "Space-Based Infrared System - Highly Elliptical Orbit payload"
country = "USA"

[orbit]
altitude_km = 40000.0
orbital_period_hours = 12.0
orbit_type = "HEO"
inclination_deg = 63.4

[sensor]
sensor_type = "Infrared"
coverage_angle_deg = 7.0
detection_range_km = 5000.0
can_detect_boost_phase = true
can_track_midcourse = false
revisit_time_sec = 1.0
