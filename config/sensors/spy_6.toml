# System identification and metadata
[system]
# Official system designation
name = "AN/SPY-6 AMDR"
# Full system description and primary role
description = "Air and Missile Defense Radar - dual-band phased array for Burke Flight III"
# Operating country/nation
country = "USA"

# Detection and coverage parameters
[detection]
# Maximum detection range for targets (km) - nominal range, actual max is 1.5x this
# SPY-6(V)1 provides SPY-1 +15 dB sensitivity - "half the size at twice the
# distance" (Raytheon, via CSIS) - i.e. ~2x SPY-1's nominal 500 km against an
# equal-RCS target. https://missilethreat.csis.org/defsys/amdr/
detection_range_km = 1000.0
# Horizontal field of view (degrees) - how wide the radar can scan
azimuth_coverage_deg = 360.0
# Minimum elevation angle radar can scan (degrees above horizon)
elevation_min_deg = 0.0
# Maximum elevation angle radar can scan (degrees, 90 = straight up)
elevation_max_deg = 90.0
# Radar frequency band - legacy field, not used when multi_band is present
radar_band = "S"
# Radar scanning mechanism type - phased_array supports multi-mode operation
radar_type = "phased_array"
# Custom mode range multipliers (better than SPY-1 due to advanced beamforming)
track_range_multiplier = 2.0       # 2.0x base range in Track mode
fire_control_range_multiplier = 3.0  # 3.0x base range in FireControl mode
# Azimuth coverage multipliers by mode - SPY-6 maintains 360° awareness in Search/Track
track_azimuth_multiplier = 1.0       # 360° coverage in Track mode (multi-face array)
fire_control_azimuth_multiplier = 0.25  # 90° coverage per face in FireControl mode

# Multi-band configuration - SPY-6 switches bands based on radar mode
[detection.multi_band]
search_band = "S"          # S-band for long-range volume search
track_band = "S"           # S-band for tracking (good range and weather penetration)
fire_control_band = "X"    # X-band for precision fire control and terminal guidance

# Tracking and processing capabilities
[tracking]
# Maximum number of targets that can be tracked simultaneously
max_simultaneous_tracks = 200  # Double SPY-1 capacity
# How many times per second the radar updates track data (Hz)
track_update_rate_hz = 15.0  # Faster updates than SPY-1
# Minimum radar cross section detectable (dBsm, lower = can detect smaller targets)
minimum_rcs_dbsm = -25.0  # Better sensitivity than SPY-1
# Maximum fire control tracks - number of targets that can receive terminal guidance simultaneously
max_fire_control_tracks = 6  # Double SPY-1 capacity
# Beam dwell times (milliseconds) - SPY-6 has faster beam steering
search_dwell_time_ms = 15.0          # Faster search scans
track_dwell_time_ms = 80.0           # Faster tracking updates
fire_control_dwell_time_ms = 500.0   # High-precision X-band terminal guidance

# Sensor calibration bias (Phase 4: realistic systematic measurement error)
# Phased arrays are boresighted to ~0.05-0.2 deg; range calibration to tens
# of meters. Deterministic per-sensor offset consumed by the EKF.
azimuth_bias_deg = 0.06
elevation_bias_deg = 0.05
range_bias_km = 0.02
# Clutter physics (Phase 5): per-scan false-alarm probability and
# clutter-density multiplier for Pd degradation (Skolnik ch. 7).
false_alarm_probability = 0.05
clutter_density = 1.2
