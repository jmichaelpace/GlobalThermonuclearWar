# System identification and metadata
[system]
# Official system designation
name = "Cobra Dane"
# Full system description and primary role
description = "AN/FPS-108 COBRA DANE phased array radar at Shemya Island, Alaska"
# Operating country/nation
country = "USA"

# Detection and coverage parameters
[detection]
# Maximum detection range for targets (km) - nominal range, actual max is 1.5x this
detection_range_km = 3000.0
# Horizontal field of view (degrees) - how wide the radar can scan
azimuth_coverage_deg = 120.0
# Minimum elevation angle radar can scan (degrees above horizon)
elevation_min_deg = 3.0
# Maximum elevation angle radar can scan (degrees, 90 = straight up)
elevation_max_deg = 85.0
# Radar frequency band - affects range, resolution, and atmospheric attenuation
radar_band = "L"  # L-band (1.2-1.4 GHz) - long range early warning
# Radar scanning mechanism type
radar_type = "phased_array"

# Tracking and processing capabilities
[tracking]
# Maximum number of targets that can be tracked simultaneously
max_simultaneous_tracks = 200
# How many times per second the radar updates track data (Hz)
track_update_rate_hz = 1.0
# Minimum radar cross section detectable (dBsm, lower = can detect smaller targets)
minimum_rcs_dbsm = -30.0
# Maximum fire control tracks
max_fire_control_tracks = 10

# Sensor calibration bias (Phase 4: realistic systematic measurement error)
# Phased arrays are boresighted to ~0.05-0.2 deg; range calibration to tens
# of meters. Deterministic per-sensor offset consumed by the EKF.
azimuth_bias_deg = 0.14
elevation_bias_deg = 0.11
range_bias_km = 0.05
