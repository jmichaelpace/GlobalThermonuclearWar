# System identification and description
[system]
# Official system designation
name = "GBI"
# Full system name and role
description = "Ground-Based Interceptor - midcourse defense"

# Launcher platform configuration
[launcher]
# Reference to interceptor configuration (by system name)
interceptor_type = "GBI EKV"
# Reference to sensor configuration (by system name)
sensor_config_name = "Cobra Dane"
# Maximum number of interceptors in inventory (US total)
max_interceptors = 44
# Time required to reload after depletion (minutes) - requires factory production
reload_time_minutes = 525600.0
# Maximum number of interceptors that can be launched in one salvo
max_salvo_size = 4
# Maximum range at which interceptors can be launched (km)
engagement_range_km = 2000.0
