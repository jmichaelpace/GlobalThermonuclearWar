# System identification and description
[system]
# Official system designation
name = "S-400"
# Full system name and role
description = "Russian long-range surface-to-air missile system with multi-radar suite"

# Launcher platform configuration
[launcher]
# Reference to interceptor configuration (by system name)
interceptor_type = "40N6"
# Maximum number of interceptors per battalion
max_interceptors = 32
# Time required to reload after depletion (minutes)
reload_time_minutes = 90.0
# Maximum number of interceptors that can be launched in one salvo
max_salvo_size = 2
# Maximum range at which interceptors can be launched (km)
# Published system specs give 250-400 km range AERODYNAMIC targets, but only
# 60 km against tactical ballistic targets (CSIS: "250-400 km, 60 km (ABM)";
# Wikipedia: "range against tactical ballistic targets: max 60"). Every
# simulated target is ballistic, so the ABM figure governs.
# https://missilethreat.csis.org/defsys/s-400-triumf/
engagement_range_km = 60.0

# Multi-sensor configuration
[[launcher.sensors]]
config_name = "91N6E Big Bird"
role = "surveillance"
azimuth_center_deg = 0.0
# Uses full 360° coverage from sensor config

[[launcher.sensors]]
config_name = "92N6E Grave Stone"
role = "fire_control"
azimuth_center_deg = 0.0
# Uses 90° coverage from sensor config
