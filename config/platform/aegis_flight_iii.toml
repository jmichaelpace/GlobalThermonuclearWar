# System identification and description
[system]
# Official system designation
name = "Aegis BMD Flight III"
# Full system name and role
description = "SM-3 Block IIA ship-based exoatmospheric with AN/SPY-6 dual-band radar"

# Launcher platform configuration
[launcher]
# Reference to interceptor configuration (by system name)
interceptor_type = "SM-3 Block IIA"
# Reference to sensor configuration (by system name)
sensor_config_name = "AN/SPY-6 AMDR"
# Maximum number of interceptors in VLS cells
max_interceptors = 96
# Time required to reload after depletion (minutes) - typically done in port
reload_time_minutes = 1440.0
# Maximum number of interceptors that can be launched in one salvo
max_salvo_size = 2
# Maximum range at which interceptors can be launched (km)
# Maximum range at which interceptors can be launched (km)
# SM-3 Block IIA flyout range: 2,500 km (SPY-6 extends the engagement envelope)
# https://missilethreat.csis.org/defsys/sm-3/
engagement_range_km = 2500.0  # Improved engagement range with SPY-6
