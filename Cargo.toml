[package]
name = "global-thermonuclear-war"
version = "0.1.0"
edition = "2021"
description = "Ballistic Missile Defense Simulation"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = "0.33"
rand = "0.8"
dotenvy = "0.15"
toml = "0.8"
